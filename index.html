<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Calendário do Advento</title>
  <meta name="theme-color" content="#0d2620">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,500&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="neve" aria-hidden="true"></div>

  <header class="topo">
    <p class="sobre">24 dias · 24 prendas</p>
    <h1>O Advento do <span id="nome">Amor</span></h1>
    <p id="contagem" class="contagem"></p>
    <p id="modo-teste" class="modo-teste" hidden>Modo de teste · tudo desbloqueado · <button id="reset" type="button">apagar progresso</button></p>
  </header>

  <main>
    <section class="calendario" id="calendario" aria-label="Calendário"></section>

    <section class="arvore-sec" aria-label="A nossa árvore">
      <h2>A nossa árvore</h2>
      <p class="sub" id="arvore-sub">Cada prenda descoberta pendura uma bola na árvore.</p>
      <div class="arvore" id="arvore">
        <svg viewBox="0 0 200 240" aria-hidden="true">
          <polygon class="t3" points="100,20 30,110 170,110"/>
          <polygon class="t2" points="100,60 18,165 182,165"/>
          <polygon class="t1" points="100,105 6,215 194,215"/>
          <rect class="tronco" x="88" y="214" width="24" height="22" rx="3"/>
        </svg>
        <div class="estrela" id="estrela">★</div>
        <div id="bolas"></div>
      </div>
    </section>
  </main>

  <div class="modal" id="modal" hidden>
    <div class="modal-fundo" data-fechar></div>
    <div class="modal-caixa" role="dialog" aria-modal="true" aria-labelledby="modal-dia">
      <button class="fechar" type="button" data-fechar aria-label="Fechar">✕</button>
      <p class="modal-dia" id="modal-dia"></p>
      <div id="modal-conteudo"></div>
    </div>
  </div>

  <div class="aviso" id="aviso" role="status"></div>
  <canvas id="confetis" aria-hidden="true"></canvas>

  <script src="prendas.js"></script>
  <script src="app.js"></script>
</body>
</html>
