<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>O XUdvento</title>
  <meta name="theme-color" content="#0d2620">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="img/icone-192.png">
  <link rel="apple-touch-icon" href="img/icone-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="XUdvento">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,500&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=11">
</head>
<body>
  <div id="neve" aria-hidden="true"></div>

  <header class="topo">
    <p class="sobre">24 dias · 24 prendas</p>
    <h1>O <span>XU</span>dvento</h1>
    <p id="contagem" class="contagem"></p>
    <p id="modo-teste" class="modo-teste" hidden>Modo de teste · tudo desbloqueado · <button id="reset" type="button">apagar progresso</button></p>
  </header>

  <main>
    <section class="calendario" id="calendario" aria-label="Calendário"></section>

  </main>

  <div class="modal" id="modal" hidden>
    <div class="modal-fundo" data-fechar></div>
    <div class="modal-caixa" role="dialog" aria-modal="true" aria-labelledby="modal-dia">
      <button class="fechar" type="button" data-fechar aria-label="Fechar">✕</button>
      <p class="modal-dia" id="modal-dia"></p>
      <div id="modal-conteudo"></div>
    </div>
  </div>

  <div class="aviso" id="aviso" role="status"></div>
  <canvas id="confetis" aria-hidden="true"></canvas>

  <script src="prendas.js?v=11"></script>
  <script src="app.js?v=11"></script>
</body>
</html>
